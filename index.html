<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <title>Tong</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap");
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: "Sixtyfour", sans-serif;
        color: #fff;
        user-select: none;
        -webkit-user-select: none;
        /* NEW: Prevent scrolling/panning on touch */
        touch-action: none;
      }
      canvas {
        display: block;
      }
      #ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      #score {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(14px, 6vh, 48px);
        text-shadow:
          0 0 10px #fff,
          0 0 20px #ff00ff,
          0 0 30px #ff00ff;
      }
      #sets {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        color: #ccc;
        display: none;
      }
      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        text-align: center;
        display: none;
        text-shadow:
          0 0 10px #fff,
          0 0 20px #00ffff,
          0 0 30px #00ffff;
      }
      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #666;
        text-align: center;
      }
      #shot-indicator {
        position: absolute;
        top: 120px;
        left: 20px;
        font-size: 18px;
        color: #0ff;
        text-shadow: 0 0 5px #0ff;
      }

      #intro-screen,
      #game-over-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: all;
        padding: 10px 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #game-over-screen {
        display: none;
      }

      .title {
        font-size: clamp(40px, 12vw, 100px);
        margin-bottom: clamp(10px, 2vh, 20px);
        text-shadow:
          0 0 20px #ff00ff,
          0 0 40px #ff00ff,
          0 0 60px #ff00ff;
        letter-spacing: 0.1em;
      }

      .instructions {
        max-width: 700px;
        text-align: center;
        font-size: clamp(11px, 2.5vh, 14px);
        line-height: 1.1;
        margin-bottom: clamp(15px, 3vh, 30px);
        color: #aaa;
        font-family: Arial, sans-serif;
      }

      .difficulty-selector {
        display: flex;
        gap: clamp(8px, 2vh, 12px);
        margin-bottom: clamp(10px, 2vh, 20px);
        flex-wrap: wrap;
        justify-content: center;
      }

      .difficulty-btn,
      .rematch-btn {
        padding: clamp(10px, 2vh, 15px) clamp(20px, 4vw, 30px);
        font-size: clamp(12px, 2.5vh, 16px);
        font-family: "Sixtyfour", sans-serif;
        background: linear-gradient(45deg, #ff00ff, #00ffff);
        border: none;
        color: #000;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        font-weight: bold;
      }

      .difficulty-btn:hover,
      .rematch-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px #ff00ff;
      }

      .difficulty-btn.selected {
        background: linear-gradient(45deg, #00ff00, #00ffff);
        box-shadow: 0 0 30px #00ff00;
      }

      .game-over-title {
        font-size: clamp(32px, 10vw, 72px);
        margin-bottom: 20px;
        text-shadow:
          0 0 20px #00ffff,
          0 0 40px #00ffff;
      }

      .final-score {
        font-size: clamp(24px, 6vw, 48px);
        margin-bottom: 30px;
        color: #ccc;
      }

      .rematch-options {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.5/pixi.min.js"></script>
  </head>
  <body>
    <div id="intro-screen">
      <div class="title">TONG</div>
      <div class="instructions">
        A kind of tennis game. Control your paddle with your mouse or finger.
        <strong>Hold to charge your shot</strong>, then release to hit the ball.
        Angle your paddle to add topspin (↑) or slice (↓). First to 11 points
        wins!
      </div>
      <div class="difficulty-selector">
        <button class="difficulty-btn" data-difficulty="beginner">
          BEGINNER
        </button>
        <button class="difficulty-btn selected" data-difficulty="medium">
          MEDIUM
        </button>
        <button class="difficulty-btn" data-difficulty="expert">EXPERT</button>
      </div>
      <button class="difficulty-btn" id="start-game-btn">START GAME</button>
    </div>

    <div id="game-over-screen">
      <div class="game-over-title"></div>
      <div class="final-score"></div>
      <div class="rematch-options"></div>
    </div>

    <div id="ui-container">
      <div id="score">0 - 0</div>
      <div id="sets">Sets: 0 - 0</div>
      <div id="message"></div>
      <div id="shot-indicator"></div>
      <div id="controls">
        Mouse position = paddle angle | Hold to charge | Release to hit
      </div>
    </div>
    <script>
      window.addEventListener("load", async () => {
        // --- Base Constants ---
        // These are the reference values for a standard desktop view.
        const BASE_PADDLE_WIDTH = 6,
          BASE_PADDLE_HEIGHT = 40,
          BASE_BALL_RADIUS = 5,
          BASE_NET_WIDTH = 4,
          BASE_NET_HEIGHT = 50,
          BASE_GRAVITY = 0.5,
          BASE_MAX_SHOT_POWER = 30,
          BASE_SHOT_CHARGE_RATE = 1.2,
          BASE_SWING_DISTANCE = 70,
          BASE_SWING_DURATION = 6,
          BASE_HIT_POWER = 10,
          BASE_SERVE_VX = 8,
          BASE_SERVE_VY = 3,
          BASE_AI_BEGINNER_SHOT_SPEED = 15,
          BASE_AI_MEDIUM_SHOT_SPEED = 18,
          BASE_AI_EXPERT_SHOT_SPEED = 23,
          BASE_NET_BOUNCE_Y_ADD = 10,
          BASE_NET_BOUNCE_VY_ADD = 3,
          BASE_POWER_SHOT_THRESHOLD = 20,
          BASE_PARTICLE_VX = 4,
          BASE_PARTICLE_VY = 4,
          BASE_PARTICLE_SIZE_MIN = 2,
          BASE_PARTICLE_SIZE_MAX = 3,
          BASE_PARTICLE_LIFE = 20,
          BASE_PADDLE_MARGIN = 50,
          BASE_PADDLE_CONTROL_Y_DIV = 150,
          BASE_AI_CENTER_MARGIN = 50,
          BASE_PADDLE_Y_MARGIN = 10,
          BASE_AI_PADDLE_MIN_X_MARGIN = 50,
          BASE_AI_NET_CLEARANCE_VY = 0.75;

        // --- Dynamic Scaled Constants ---
        // These will be recalculated whenever the screen is resized.
        let PADDLE_WIDTH,
          PADDLE_HEIGHT,
          BALL_RADIUS,
          NET_WIDTH,
          NET_HEIGHT,
          GRAVITY,
          MAX_SHOT_POWER,
          SHOT_CHARGE_RATE,
          SWING_DISTANCE,
          SWING_DURATION,
          HIT_POWER,
          SERVE_VX,
          SERVE_VY,
          AI_BEGINNER_SHOT_SPEED,
          AI_MEDIUM_SHOT_SPEED,
          AI_EXPERT_SHOT_SPEED,
          NET_BOUNCE_Y_ADD,
          NET_BOUNCE_VY_ADD,
          POWER_SHOT_THRESHOLD,
          PARTICLE_VX,
          PARTICLE_VY,
          PARTICLE_SIZE_MIN,
          PARTICLE_SIZE_MAX,
          PARTICLE_LIFE,
          PADDLE_MARGIN,
          PADDLE_CONTROL_Y_DIV,
          AI_CENTER_MARGIN,
          PADDLE_Y_MARGIN,
          AI_PADDLE_MIN_X_MARGIN,
          AI_NET_CLEARANCE_VY;

        // --- Static Constants ---
        const GAME_SPEED_MODIFIER = 1.0;
        const TOPSPIN_GRAVITY_MULT = 1.8;
        const SLICE_GRAVITY_MULT = 0.55;
        const COURT_Y_FACTOR = 0.75;
        const MAX_PADDLE_ANGLE = Math.PI / 6;
        const PADDLE_SPEED = 0.35;
        const AI_PADDLE_SPEED_X = 0.08;

        // Base values for a standard desktop view (e.g., ~16:9 aspect ratio or wider)

        const PLAYER_COLOR_HEX = "#00FFFF";
        const AI_COLOR_HEX = "#FFA500";

        const scoreElement = document.getElementById("score");
        const setsElement = document.getElementById("sets");
        const messageElement = document.getElementById("message");
        const shotIndicator = document.getElementById("shot-indicator");
        const introScreen = document.getElementById("intro-screen");
        const gameOverScreen = document.getElementById("game-over-screen");

        let app,
          player1,
          player2,
          ball,
          net,
          floor,
          trail,
          contactLine,
          serveTrajectoryLine;
        let state = {};
        let trailPoints = [];
        let particles = [];
        let touchState = {};
        let AI_DIFFICULTY = "medium";
        let gameStarted = false;

        function calculateScaleFactor(screenW, screenH) {
          // Calculate a factor based on screen height for vertical scaling
          // Assuming a "standard" height of 600px for full-size elements.
          const baseHeight = 600;
          const heightFactor = screenH / baseHeight;

          // For desktop/wider screens (e.g., ratio > 1.7), keep a factor of 1 or a bit more.
          // For very narrow height (landscape phones, ratio < 1.7), aggressively shrink it.
          const aspectRatio = screenW / screenH;

          let scaleFactor = heightFactor;

          if (aspectRatio > 1.7) {
            // Landscape phone/tablet: Use a clamped, smaller factor
            scaleFactor = Math.min(1.0, Math.max(0.15, heightFactor * 0.8));
          } else if (aspectRatio < 1) {
            // Portrait mode: Use a less aggressive factor
            scaleFactor = Math.min(1.0, heightFactor * 1.2);
          } else {
            // Standard desktop: Clamp to a max of 1.2 to prevent excessive growth
            scaleFactor = Math.min(1.2, heightFactor);
          }

          // Ensures objects don't disappear on tiny screens
          return Math.max(0.2, scaleFactor);
        }

        function initializeGameState() {
          state = {
            ballInPlay: false,
            shotCharging: false,
            shotPower: 0,
            bounces: 0,
            lastPaddleHitSide: null,
            lastBounceSide: null,
            servingPlayer: "player1",
            scores: { player1: { points: 0 }, player2: { points: 0 } },
            gameOver: false,
            ballSpin: 0,
            lastShotType: undefined,
            mustBounceBeforeHit: false,
            hasBouncedOnCurrentSide: false,
            aiWillMiss: false,
            aiCanHit: true,
            aiServeTargetX: null,
          };

          touchState = {
            isCharging: false,
            isMovingPaddle: false,
            startX: 0,
            startY: 0,
            startPaddleX: 0,
            startPaddleAngle: 0,
          };
        }

        function setupScene() {
          floor = new PIXI.Graphics();
          net = new PIXI.Graphics();
          trail = new PIXI.Graphics();
          contactLine = new PIXI.Graphics();
          serveTrajectoryLine = new PIXI.Graphics();

          // Note: Paddle creation is now done *after* constants are set in resizeAndPosition

          ball = new PIXI.Graphics();
          ball.vx = 0;
          ball.vy = 0;
          ball.prevX = 0;
          ball.prevY = 0;

          app.stage.addChild(
            floor,
            net,
            trail,
            contactLine,
            ball,
            serveTrajectoryLine,
          );
        }
        function drawServeTrajectory(toLeft) {
          serveTrajectoryLine.clear();
          const screenW = app.screen.width;
          const screenH = app.screen.height;
          const courtY = screenH * COURT_Y_FACTOR;

          // Simulate the ball's path without affecting the actual ball
          let simX = screenW / 2;
          let simY = courtY - NET_HEIGHT * 3.6;
          let simVY = SERVE_VY;
          const simVX = toLeft ? -SERVE_VX : SERVE_VX;

          const pathPoints = [];
          while (simY < courtY) {
            simVY += GRAVITY;
            simX += simVX;
            simY += simVY;
            pathPoints.push({ x: simX, y: simY });
          }

          // Draw the trajectory as a series of dots
          for (let i = 0; i < pathPoints.length; i += 3) {
            const p = pathPoints[i];
            serveTrajectoryLine.circle(
              p.x,
              p.y,
              2 * (i / pathPoints.length) + 1,
            );
            serveTrajectoryLine.fill({ color: 0xffffff, alpha: 0.3 });
          }
        }
        function resizeAndPosition() {
          const screenW = app.screen.width,
            screenH = app.screen.height;
          const scaleFactor = calculateScaleFactor(screenW, screenH);

          // --- Apply Scaling Factor to Constants ---
          PADDLE_WIDTH = BASE_PADDLE_WIDTH * scaleFactor;
          PADDLE_HEIGHT = BASE_PADDLE_HEIGHT * scaleFactor;
          BALL_RADIUS = BASE_BALL_RADIUS * scaleFactor;
          NET_WIDTH = BASE_NET_WIDTH * scaleFactor;
          NET_HEIGHT = BASE_NET_HEIGHT * scaleFactor;
          GRAVITY = BASE_GRAVITY * scaleFactor;
          MAX_SHOT_POWER = BASE_MAX_SHOT_POWER * scaleFactor;
          SHOT_CHARGE_RATE = BASE_SHOT_CHARGE_RATE * scaleFactor;
          SWING_DISTANCE = BASE_SWING_DISTANCE * scaleFactor;
          // SWING_DURATION is time-based, so it should not be scaled.
          SWING_DURATION = BASE_SWING_DURATION;
          HIT_POWER = BASE_HIT_POWER * scaleFactor;
          SERVE_VX = BASE_SERVE_VX * scaleFactor;
          SERVE_VY = BASE_SERVE_VY * scaleFactor;
          AI_BEGINNER_SHOT_SPEED = BASE_AI_BEGINNER_SHOT_SPEED * scaleFactor;
          AI_MEDIUM_SHOT_SPEED = BASE_AI_MEDIUM_SHOT_SPEED * scaleFactor;
          AI_EXPERT_SHOT_SPEED = BASE_AI_EXPERT_SHOT_SPEED * scaleFactor;
          NET_BOUNCE_Y_ADD = BASE_NET_BOUNCE_Y_ADD * scaleFactor;
          NET_BOUNCE_VY_ADD = BASE_NET_BOUNCE_VY_ADD * scaleFactor;
          POWER_SHOT_THRESHOLD = BASE_POWER_SHOT_THRESHOLD * scaleFactor;
          PARTICLE_VX = BASE_PARTICLE_VX * scaleFactor;
          PARTICLE_VY = BASE_PARTICLE_VY * scaleFactor;
          PARTICLE_SIZE_MIN = BASE_PARTICLE_SIZE_MIN * scaleFactor;
          PARTICLE_SIZE_MAX = BASE_PARTICLE_SIZE_MAX * scaleFactor;
          PARTICLE_LIFE = BASE_PARTICLE_LIFE * scaleFactor;
          PADDLE_MARGIN = BASE_PADDLE_MARGIN * scaleFactor;
          PADDLE_CONTROL_Y_DIV = BASE_PADDLE_CONTROL_Y_DIV * scaleFactor;
          AI_CENTER_MARGIN = BASE_AI_CENTER_MARGIN * scaleFactor;
          PADDLE_Y_MARGIN = BASE_PADDLE_Y_MARGIN * scaleFactor;
          AI_PADDLE_MIN_X_MARGIN = BASE_AI_PADDLE_MIN_X_MARGIN * scaleFactor;
          AI_NET_CLEARANCE_VY = BASE_AI_NET_CLEARANCE_VY * scaleFactor;

          const courtY = screenH * COURT_Y_FACTOR;

          floor.clear();
          floor.rect(0, courtY, screenW, 3 * scaleFactor);
          floor.fill(0x888888);

          net.clear();
          net.rect(
            screenW / 2 - NET_WIDTH / 2,
            courtY - NET_HEIGHT,
            NET_WIDTH,
            NET_HEIGHT,
          );
          net.fill(0xff00ff);

          // --- Recreate/Update Paddles and Ball with new dimensions ---

          if (!player1) {
            player1 = createPaddle(0x00ffff);
            app.stage.addChild(player1);
          }
          if (!player2) {
            player2 = createPaddle(0xffa500);
            app.stage.addChild(player2);
          }

          redrawPaddle(player1);
          redrawPaddle(player2);

          ball.clear();
          ball.circle(0, 0, BALL_RADIUS);
          ball.fill(0xffff00);

          player1.baseX = screenW * 0.2;
          player2.baseX = screenW * 0.8;

          const paddleY = courtY - NET_HEIGHT / 2;
          player1.targetY = paddleY;
          player2.targetY = paddleY;
          player1.y = player1.targetY;
          player2.y = player2.targetY;
          player1.x = player1.baseX;
          player2.x = player2.baseX;
        }

        function createPaddle(color) {
          const p = new PIXI.Graphics();
          p.rect(
            -PADDLE_WIDTH / 2,
            -PADDLE_HEIGHT / 2,
            PADDLE_WIDTH,
            PADDLE_HEIGHT,
          );
          p.fill(color);
          p.swing = { active: false, progress: 0 };
          p.targetY = 0;
          p.paddleColor = color;
          p.baseX = 0;
          return p;
        }

        function addControls() {
          app.stage.eventMode = "static";
          app.stage.hitArea = app.screen;
          app.canvas.style.touchAction = "none";

          const handlePointerDown = (e) => {
            if (state.gameOver) return;

            if (e.pointerType === "mouse") {
              if (
                state.ballInPlay &&
                !player1.swing.active &&
                !state.shotCharging
              ) {
                startShotCharge();
              }
              return;
            }

            const screenW = app.screen.width;
            const x = e.global.x;

            if (x < screenW / 2) {
              if (!state.shotCharging && !player1.swing.active) {
                touchState.isMovingPaddle = true;
                touchState.startX = x;
                touchState.startY = e.global.y;
                touchState.startPaddleX = player1.baseX;
              }
            } else {
              if (
                state.ballInPlay &&
                !player1.swing.active &&
                !touchState.isCharging
              ) {
                touchState.isCharging = true;
                startShotCharge();
              }
            }
          };

          const handlePointerUp = () => {
            if (state.shotCharging) {
              releaseShot();
            }
            touchState.isCharging = false;
            touchState.isMovingPaddle = false;
          };

          const handlePointerMove = (e) => {
            if (touchState.isMovingPaddle) {
              const deltaX = e.global.x - touchState.startX;
              const deltaY = e.global.y - touchState.startY;
              updatePaddleControl(deltaX, deltaY, "relative");
            } else if (e.pointerType === "mouse") {
              updatePaddleControl(e.global.x, e.global.y, "absolute");
            }
          };

          app.stage.on("pointerdown", handlePointerDown);
          app.stage.on("pointerup", handlePointerUp);
          app.stage.on("pointerupoutside", handlePointerUp);
          app.stage.on("pointermove", handlePointerMove);

          window.addEventListener("keydown", (e) => {
            if (
              e.code === "Space" &&
              !state.shotCharging &&
              state.ballInPlay &&
              !state.gameOver
            ) {
              e.preventDefault();
              startShotCharge();
            }
          });

          window.addEventListener("keyup", (e) => {
            if (e.code === "Space" && state.shotCharging) {
              e.preventDefault();
              releaseShot();
            }
          });
        }

        function updatePaddleControl(x, y, mode = "absolute") {
          const screenW = app.screen.width;
          const screenH = app.screen.height;
          const courtY = screenH * COURT_Y_FACTOR;

          if (mode === "relative") {
            const newBaseX = touchState.startPaddleX + x;
            player1.baseX = Math.max(
              PADDLE_WIDTH * 2,
              Math.min(screenW / 2 - PADDLE_MARGIN, newBaseX),
            );

            const normalizedY = Math.max(
              -1,
              Math.min(1, y / PADDLE_CONTROL_Y_DIV),
            );
            player1.rotation = normalizedY * MAX_PADDLE_ANGLE;
          } else {
            player1.baseX = Math.max(
              PADDLE_WIDTH * 2,
              Math.min(screenW / 2 - PADDLE_MARGIN, x),
            );

            const minY = courtY - PADDLE_HEIGHT * 3;
            const maxY = courtY - PADDLE_HEIGHT * 0.5;
            const clampedY = Math.max(minY, Math.min(maxY, y));
            const centerY = (minY + maxY) / 2;

            const offsetY = clampedY - centerY;
            const range = (maxY - minY) / 2;
            const normalizedY = offsetY / range;

            player1.rotation = normalizedY * MAX_PADDLE_ANGLE;
          }

          const angleDeg = (player1.rotation * 180) / Math.PI;
          let shotType = "FLAT";
          if (angleDeg < -10) shotType = "SLICE ↓";
          else if (angleDeg > 10) shotType = "TOPSPIN ↑";

          shotIndicator.innerHTML = `${shotType} (${angleDeg.toFixed(0)}°)`;
          shotIndicator.style.color =
            angleDeg < -15 ? "#ff00ff" : angleDeg > 15 ? "#ff6600" : "#00ffff";
        }

        function startShotCharge() {
          if (!player1.swing.active) {
            state.shotCharging = true;
            state.shotPower = 0;
          }
        }

        function releaseShot() {
          if (state.shotCharging) {
            state.shotCharging = false;
            player1.swing.active = true;
            player1.swing.progress = 0;
            player1.scale.set(1, 1);
            redrawPaddle(player1);
          }
        }

        function redrawPaddle(p) {
          p.clear();
          p.rect(
            -PADDLE_WIDTH / 2,
            -PADDLE_HEIGHT / 2,
            PADDLE_WIDTH,
            PADDLE_HEIGHT,
          );
          p.fill(p.paddleColor);
        }

        function updatePlayerSwing(delta) {
          const p1 = player1;

          contactLine.clear();

          if (state.shotCharging) {
            const chargeRatio = Math.min(1, state.shotPower / MAX_SHOT_POWER);
            p1.x = p1.baseX - chargeRatio * SWING_DISTANCE;
            p1.scale.set(1 - chargeRatio * 0.4, 1 + chargeRatio * 0.2);

            p1.clear();
            p1.rect(
              -PADDLE_WIDTH / 2,
              -PADDLE_HEIGHT / 2,
              PADDLE_WIDTH,
              PADDLE_HEIGHT,
            );
            p1.fill(p1.paddleColor);

            if (chargeRatio > 0.3) {
              const glowSize = 3 + chargeRatio * 8;
              p1.rect(
                -PADDLE_WIDTH / 2 - glowSize,
                -PADDLE_HEIGHT / 2 - glowSize,
                PADDLE_WIDTH + glowSize * 2,
                PADDLE_HEIGHT + glowSize * 2,
              );
              p1.stroke({ width: 3, color: 0xffffff, alpha: chargeRatio });
            }

            if (chargeRatio > 0.9) {
              const pulse = Math.sin(Date.now() / 50) * 0.5 + 0.5;
              p1.circle(0, 0, PADDLE_HEIGHT / 2 + 10);
              p1.stroke({ width: 2, color: 0xff0000, alpha: pulse * 0.8 });
            }

            const lineLength = PADDLE_HEIGHT * 1.25;
            contactLine.rect(-1, -lineLength / 2, 2, lineLength);
            contactLine.fill({ color: 0x00ffff, alpha: chargeRatio * 0.8 });

            contactLine.x = p1.baseX + (SWING_DISTANCE * 1.5) / 2;
            contactLine.y = p1.y;
            contactLine.rotation = p1.rotation;
          }

          if (!p1.swing.active) return;

          p1.swing.progress += delta;
          p1.scale.set(1, 1);
          redrawPaddle(p1);

          const swingRatio = Math.min(1, p1.swing.progress / SWING_DURATION);
          const swingArc = Math.sin(swingRatio * Math.PI);
          p1.x = p1.baseX + swingArc * SWING_DISTANCE * 1.5;

          const hitboxWidth = PADDLE_WIDTH * 3;
          const hitboxHeight = PADDLE_HEIGHT * 1.5;

          const ballSide = getBallSide();
          const canHit = ballSide === "player1";

          if (
            canHit &&
            circleRectCollision(
              ball.x,
              ball.y,
              BALL_RADIUS,
              p1.x,
              p1.y,
              hitboxWidth,
              hitboxHeight,
            )
          ) {
            hitBall(swingRatio);
            p1.swing.active = false;
            p1.x = p1.baseX;
          }

          if (p1.swing.progress >= SWING_DURATION) {
            p1.swing.active = false;
            p1.x = p1.baseX;
            state.shotPower = 0;
          }
        }

        function hitBall(timingFactor) {
          const basePower = HIT_POWER + state.shotPower * 0.8;
          const timingBonus = 1 - Math.abs(0.5 - timingFactor) * 2;
          const isPerfectTiming = timingBonus > 0.8;

          let power = basePower * (1 + timingBonus * 0.5);
          const angleDeg = (player1.rotation * 180) / Math.PI;

          let shotType = "flat";
          let spinValue = 0;
          if (angleDeg < -10) {
            shotType = "slice";
            spinValue = -1;
          } else if (angleDeg > 10) {
            shotType = "topspin";
            spinValue = 1;
          }

          if (shotType === "slice") {
            power *= 0.75;
          }

          state.ballSpin = spinValue;
          state.lastShotType = shotType;

          const angle = player1.rotation;

          ball.vx = Math.cos(angle) * power * GAME_SPEED_MODIFIER;

          if (shotType === "slice") {
            // Reverted to a lower vy to keep the shot flat
            ball.vy = -Math.sin(Math.abs(angle)) * power * 0.3;
          } else {
            ball.vy = -Math.sin(angle) * power * 0.55;
          }

          if (isPerfectTiming && state.shotPower > POWER_SHOT_THRESHOLD) {
            createFireEffect(ball.x, ball.y);
            ball.vx *= 1.3;
            showMessage("POWER SHOT! 🔥", false);
          }

          state.bounces = 0;
          state.lastPaddleHitSide = getBallSide();
          state.lastBounceSide = null;
          state.mustBounceBeforeHit = true;
          state.hasBouncedOnCurrentSide = false;
          state.shotPower = 0;
          state.aiCanHit = true;
        }

        function createFireEffect(x, y) {
          for (let i = 0; i < 8; i++) {
            const particle = new PIXI.Graphics();
            particle.circle(
              0,
              0,
              Math.random() * PARTICLE_SIZE_MAX + PARTICLE_SIZE_MIN,
            );
            particle.fill(Math.random() > 0.5 ? 0xff6600 : 0xff0000);
            particle.x = x;
            particle.y = y;
            particle.alpha = 1;
            particle.vx = (Math.random() - 0.5) * PARTICLE_VX;
            particle.vy = (Math.random() - 0.5) * PARTICLE_VY;
            particle.initialLife = PARTICLE_LIFE;
            particle.life = PARTICLE_LIFE;
            app.stage.addChild(particle);
            particles.push(particle);
          }
        }

        function startServe(toLeft) {
          serveTrajectoryLine.clear();
          hideMessage();
          state.bounces = 0;
          state.lastPaddleHitSide = null;
          state.lastBounceSide = null;
          state.lastShotType = undefined;
          state.ballSpin = 0;
          state.mustBounceBeforeHit = false;
          state.hasBouncedOnCurrentSide = false;
          trailPoints = [];

          const screenW = app.screen.width;
          const screenH = app.screen.height;
          const courtY = screenH * COURT_Y_FACTOR;

          ball.x = screenW / 2;
          ball.y = courtY - NET_HEIGHT * 3.6;
          ball.vx = toLeft ? -SERVE_VX : SERVE_VX;
          ball.vy = SERVE_VY;

          state.ballInPlay = true;
        }

        function updatePaddlePositions(delta) {
          const courtY = app.screen.height * COURT_Y_FACTOR;
          const minY = PADDLE_HEIGHT / 2 + PADDLE_Y_MARGIN;
          const maxY = courtY - PADDLE_HEIGHT / 2 - PADDLE_Y_MARGIN;
          const screenW = app.screen.width;

          if (
            state.ballInPlay &&
            ball.x < screenW / 2 &&
            ball.y > minY &&
            ball.y < maxY
          ) {
            player1.targetY = ball.y;
          } else {
            player1.targetY = courtY - NET_HEIGHT / 2;
          }

          let targetX_AI;
          const isAiServing =
            !state.lastPaddleHitSide && getBallSide() === "player2";

          if (isAiServing && state.aiServeTargetX) {
            // --- THIS IS THE KEY CHANGE ---
            // Move to the PREDICTED X coordinate, not the current ball's X.
            targetX_AI = state.aiServeTargetX;
            player2.targetY = courtY - NET_HEIGHT * 1.3; // Move to fixed ready height
          } else if (state.ballInPlay && ball.x >= screenW / 2) {
            const minX = screenW / 2 + AI_PADDLE_MIN_X_MARGIN;
            const maxX = screenW - PADDLE_WIDTH * 2;
            targetX_AI = Math.max(minX, Math.min(maxX, ball.x));
            if (ball.y > minY && ball.y < maxY) {
              player2.targetY = ball.y;
            } else {
              player2.targetY = courtY - NET_HEIGHT / 2;
            }
          } else {
            targetX_AI = screenW * 0.8;
            player2.targetY = courtY - NET_HEIGHT / 2;
          }

          const current_ai_x_speed = isAiServing ? 0.35 : AI_PADDLE_SPEED_X;
          const ai_x_interp = 1 - Math.pow(1 - current_ai_x_speed, delta);
          const paddle_y_interp = 1 - Math.pow(1 - PADDLE_SPEED, delta);

          player2.baseX += (targetX_AI - player2.baseX) * ai_x_interp;
          player1.y += (player1.targetY - player1.y) * paddle_y_interp;
          player2.y += (player2.targetY - player2.y) * paddle_y_interp;

          if (!player1.swing.active && !state.shotCharging) {
            player1.x = player1.baseX;
          }
          if (!player2.swing.active) {
            player2.x = player2.baseX;
          }
        }

        function aiLogic(delta) {
          const p2 = player2,
            screenW = app.screen.width,
            screenH = app.screen.height;
          const courtY = screenH * COURT_Y_FACTOR;

          if (!state.ballInPlay || getBallSide() === "player1") {
            p2.rotation *= 0.85;
            return;
          }

          const isAiServing = !state.lastPaddleHitSide;
          let missChance = 0,
            baseShotSpeed = 0,
            velocityError = 0,
            targetAccuracy = 0,
            targetSpread = 0;

          if (AI_DIFFICULTY === "beginner") {
            targetAccuracy = 0.6;
            velocityError = 0.5;
            missChance = 0.3;
            baseShotSpeed = AI_BEGINNER_SHOT_SPEED;
            targetSpread = 0.4;
          } else if (AI_DIFFICULTY === "medium") {
            targetAccuracy = 0.4;
            velocityError = 0.25;
            missChance = 0.15;
            baseShotSpeed = AI_MEDIUM_SHOT_SPEED;
            targetSpread = 0.3;
          } else {
            targetAccuracy = 0.2;
            velocityError = 0.03;
            missChance = 0;
            baseShotSpeed = AI_EXPERT_SHOT_SPEED;
            targetSpread = 0.15;
          }

          if (isAiServing) {
            missChance = 0; // AI never misses its own serve toss.
            velocityError = 0.05;
          }

          if (
            state.aiWillMissThisShot === undefined &&
            state.mustBounceBeforeHit &&
            !state.hasBouncedOnCurrentSide
          ) {
            state.aiWillMissThisShot = Math.random() < missChance;
          }
          if (state.aiWillMissThisShot) return;

          p2.rotation = 0;
          const hitboxWidth = PADDLE_WIDTH * 3;
          const hitboxHeight = PADDLE_HEIGHT * 1.5;
          const canHit =
            getBallSide() === "player2" &&
            (!state.mustBounceBeforeHit || state.hasBouncedOnCurrentSide);

          // --- NEW HITTING WINDOW LOGIC ---
          const serveContactHeight = courtY - NET_HEIGHT * 1.3;
          const isInServeWindow =
            isAiServing && ball.vy > 0 && ball.y > serveContactHeight;
          const isInRallyWindow =
            !isAiServing && ball.y > courtY - NET_HEIGHT * 0.8;

          if (
            state.aiCanHit &&
            canHit &&
            (isInServeWindow || isInRallyWindow) &&
            circleRectCollision(
              ball.x,
              ball.y,
              BALL_RADIUS,
              p2.x,
              p2.y,
              hitboxWidth,
              hitboxHeight,
            )
          ) {
            let vx, vy;

            if (isAiServing) {
              state.ballSpin = -1; // Always slice the serve
              const targetX = screenW * 0.25;
              const targetY = courtY - BALL_RADIUS;
              const dx = targetX - ball.x;
              const dy = targetY - ball.y;

              const effectiveGravity = GRAVITY * SLICE_GRAVITY_MULT;
              const shotSpeed = baseShotSpeed * 0.95;
              const flightTime = Math.abs(dx / shotSpeed);

              vx = dx / flightTime;
              vy = dy / flightTime - 0.5 * effectiveGravity * flightTime;
              vy -= AI_NET_CLEARANCE_VY * 1.5; // Extra clearance for reliability
            } else {
              // Standard Rally Logic (unchanged)
              const playerCourtWidth = screenW / 2;
              const targetableMinX = PADDLE_WIDTH * 4;
              const targetableMaxX = playerCourtWidth - AI_CENTER_MARGIN;
              const targetableWidth = targetableMaxX - targetableMinX;
              const randomTargetPoint =
                targetableMinX +
                targetableWidth *
                  (0.5 - targetAccuracy / 2 + Math.random() * targetAccuracy);
              const targetX =
                randomTargetPoint +
                (Math.random() - 0.5) * targetableWidth * targetSpread;
              const targetY = courtY - BALL_RADIUS * 1.5;
              const dx = targetX - ball.x;
              const dy = targetY - ball.y;

              const isHighBall = courtY - ball.y > NET_HEIGHT * 0.8;
              state.ballSpin =
                Math.random() < (isHighBall ? 0.9 : 0.15) ? 1 : -1;

              const gravityMult =
                state.ballSpin > 0 ? TOPSPIN_GRAVITY_MULT : SLICE_GRAVITY_MULT;
              const effectiveGravity = GRAVITY * gravityMult;
              const shotSpeed =
                baseShotSpeed * (1 + (Math.random() - 0.5) * velocityError);
              const flightTime = Math.abs(dx / shotSpeed);
              vy = dy / flightTime - 0.5 * effectiveGravity * flightTime;
              vx = dx / flightTime;
            }

            // Common physics and state update
            ball.vx = vx;
            ball.vy = vy;
            p2.rotation = Math.max(-0.4, Math.min(0.9, Math.atan2(-vy, -vx)));
            state.bounces = 0;
            state.lastPaddleHitSide = getBallSide();
            state.lastBounceSide = null;
            state.mustBounceBeforeHit = true;
            state.hasBouncedOnCurrentSide = false;
            state.aiCanHit = false;
          }
        }

        function updateTrail() {
          if (!state.ballInPlay) return;

          trailPoints.push({ x: ball.x, y: ball.y, alpha: 1 });
          if (trailPoints.length > 15) trailPoints.shift();

          trail.clear();
          for (let i = 0; i < trailPoints.length; i++) {
            const point = trailPoints[i];
            const alpha = (i / trailPoints.length) * 0.6;
            const size = (i / trailPoints.length) * BALL_RADIUS;
            trail.circle(point.x, point.y, size);
            trail.fill({ color: 0xffff00, alpha });
          }
        }

        function gameLoop(ticker) {
          if (state.gameOver || !gameStarted) return;

          const delta = ticker.deltaTime || 1;
          const gameDelta = delta * GAME_SPEED_MODIFIER;

          const timeScale = state.shotCharging ? 0.4 : 1.0;
          const ballDelta = gameDelta * timeScale;

          if (state.shotCharging) {
            state.shotPower = Math.min(
              MAX_SHOT_POWER,
              state.shotPower + SHOT_CHARGE_RATE * delta,
            );
          }

          updatePaddlePositions(gameDelta);
          updatePlayerSwing(delta);
          updateTrail();

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * ballDelta;
            p.y += p.vy * ballDelta;
            p.life--;
            p.alpha = Math.max(0, p.life / p.initialLife);
            if (p.life <= 0) {
              app.stage.removeChild(p);
              particles.splice(i, 1);
            }
          }

          if (state.ballInPlay) {
            aiLogic(ballDelta);

            const gravityMult =
              state.ballSpin > 0
                ? TOPSPIN_GRAVITY_MULT
                : state.ballSpin < 0
                  ? SLICE_GRAVITY_MULT
                  : 1;
            ball.vy += GRAVITY * gravityMult * ballDelta;

            ball.prevX = ball.x;
            ball.prevY = ball.y;

            ball.x += ball.vx * ballDelta;
            ball.y += ball.vy * ballDelta;

            const screenW = app.screen.width,
              screenH = app.screen.height;
            const courtY = screenH * COURT_Y_FACTOR;

            if (ball.y + BALL_RADIUS >= courtY) {
              ball.y = courtY - BALL_RADIUS;

              // --- MODIFICATION START: Spin-dependent bounce physics ---
              if (state.ballSpin < 0) {
                // Slice (backspin)
                ball.vy *= -0.55; // Stays very low
                ball.vx *= 0.88; // Loses more forward speed (skids)
              } else if (state.ballSpin > 0) {
                // Topspin
                ball.vy *= -0.8; // Bounces higher
                ball.vx *= 0.96; // Retains more forward speed (kicks)
              } else {
                // Flat
                ball.vy *= -0.75; // Normal bounce
                ball.vx *= 0.92;
              }
              // --- MODIFICATION END ---

              const bounceSide = getBallSide();

              if (state.lastPaddleHitSide === bounceSide) {
                const winner = bounceSide === "player1" ? "player2" : "player1";
                pointOver(winner);
                return;
              }

              state.hasBouncedOnCurrentSide = true;
              if (state.lastBounceSide !== bounceSide) {
                state.bounces = 1;
                state.lastBounceSide = bounceSide;
              } else {
                state.bounces++;
              }

              if (state.bounces >= 2) {
                pointOver(bounceSide === "player1" ? "player2" : "player1");
              }
            }

            if (ball.y - BALL_RADIUS <= 0) {
              ball.y = BALL_RADIUS;
              ball.vy *= -0.8;
            }

            if (ball.x + BALL_RADIUS < 0 || ball.x - BALL_RADIUS > screenW) {
              if (state.lastPaddleHitSide) {
                const lastHitter = state.lastPaddleHitSide;
                const opponent =
                  lastHitter === "player1" ? "player2" : "player1";
                if (state.lastBounceSide === opponent) {
                  pointOver(lastHitter);
                } else {
                  pointOver(opponent);
                }
              } else {
                pointOver(ball.x < screenW / 2 ? "player2" : "player1");
              }
            }

            const netX = screenW / 2;
            const netTopY = courtY - NET_HEIGHT;

            const crossedNet =
              (ball.prevX < netX && ball.x >= netX) ||
              (ball.prevX > netX && ball.x <= netX);

            if (crossedNet) {
              const t = (netX - ball.prevX) / (ball.x - ball.prevX);
              const crossY = ball.prevY + t * (ball.y - ball.prevY);

              if (crossY > netTopY - BALL_RADIUS) {
                ball.x =
                  ball.prevX < netX ? netX - BALL_RADIUS : netX + BALL_RADIUS;
                ball.y = crossY;
                ball.vx *= -0.5;
                ball.vy *= 0.6;

                if (crossY < netTopY + NET_BOUNCE_Y_ADD) {
                  ball.vy =
                    -Math.abs(ball.vy) * 0.4 -
                    Math.random() * NET_BOUNCE_VY_ADD;
                }
              }
            }
          }
        }

        function pointOver(winner) {
          if (!state.ballInPlay) return;
          const loser = winner === "player1" ? "player2" : "player1";
          state.scores[winner].points++;
          updateScore(winner, loser);
          resetRound();
        }

        function updateScore(winner, loser) {
          const p1Score = state.scores.player1,
            p2Score = state.scores.player2;
          const winnerPoints = state.scores[winner].points,
            loserPoints = state.scores[loser].points;

          const totalPoints = p1Score.points + p2Score.points;
          if (totalPoints > 0 && totalPoints % 2 === 0) {
            state.servingPlayer =
              state.servingPlayer === "player1" ? "player2" : "player1";
          }

          if (p1Score.points >= 10 && p2Score.points >= 10) {
            state.servingPlayer =
              state.servingPlayer === "player1" ? "player2" : "player1";
          }

          if (winnerPoints >= 11 && winnerPoints - loserPoints >= 2) {
            state.gameOver = true;
            showGameOver(winner);
            return;
          }

          updateScoreUI();
        }

        function updateScoreUI() {
          const p1s = state.scores.player1,
            p2s = state.scores.player2;
          let scoreHTML;

          if (p1s.points >= 10 && p2s.points >= 10) {
            const serveBall1 = state.servingPlayer === "player1" ? " 🎾" : "";
            const serveBall2 = state.servingPlayer === "player2" ? " 🎾" : "";

            if (p1s.points === p2s.points) {
              scoreHTML = `<span style="color: ${PLAYER_COLOR_HEX};">${p1s.points}${serveBall1}</span> - <span style="color: ${AI_COLOR_HEX};">${p2s.points}${serveBall2}</span>`;
            } else if (p1s.points > p2s.points) {
              scoreHTML = `<span style="color: ${PLAYER_COLOR_HEX};">Advantage Player${serveBall1}</span>`;
            } else {
              scoreHTML = `<span style="color: ${AI_COLOR_HEX};">Advantage AI${serveBall2}</span>`;
            }
          } else {
            const serveBall1 = state.servingPlayer === "player1" ? " 🎾" : "";
            const serveBall2 = state.servingPlayer === "player2" ? " 🎾" : "";

            const p1Display = `<span style="color: ${PLAYER_COLOR_HEX};">${p1s.points}${serveBall1}</span>`;
            const p2Display = `<span style="color: ${AI_COLOR_HEX};">${p2s.points}${serveBall2}</span>`;
            scoreHTML = `${p1Display} - ${p2Display}`;
          }

          scoreElement.innerHTML = scoreHTML;
        }

        function resetRound() {
          state.ballInPlay = false;
          ball.x = -2000;
          ball.y = -2000;
          ball.vx = 0;
          ball.vy = 0;
          trailPoints = [];
          trail.clear();
          state.aiServeTargetX = null; // Clear previous target

          if (!state.gameOver) {
            const toLeft = state.servingPlayer === "player1";

            // --- PREDICTION LOGIC ---
            // Predict where the AI needs to be to hit the serve.
            if (!toLeft) {
              // Only predict if the serve is to the AI's side
              const screenW = app.screen.width;
              const screenH = app.screen.height;
              const courtY = screenH * COURT_Y_FACTOR;
              const serveContactHeight = courtY - NET_HEIGHT * 1.3;

              let simX = screenW / 2;
              let simY = courtY - NET_HEIGHT * 3.6;
              let simVY = SERVE_VY;
              const simVX = SERVE_VX; // AI serve is always to the right

              // --- New High-Fidelity Simulation ---
              // We run the simulation with a small, fixed time step (dt) to get a more
              // accurate prediction, independent of the game's actual framerate.
              const dt = 0.1;
              let safetyCounter = 0;
              let hasReachedApex = false;

              // Loop until the ball falls to the contact height or goes out of bounds.
              while (simY < courtY && safetyCounter < 5000) {
                simVY += GRAVITY * dt;
                simX += simVX * dt;
                simY += simVY * dt;
                safetyCounter++;

                if (!hasReachedApex && simVY > 0) hasReachedApex = true;

                // Check if the ball has fallen into the hitting zone.
                if (hasReachedApex && simY >= serveContactHeight) {
                  state.aiServeTargetX = simX; // Store the accurate prediction (no magic number needed)
                  break;
                }
              }
            }
            // --- END PREDICTION ---

            drawServeTrajectory(toLeft);
            setTimeout(() => startServe(toLeft), 1200);
          }
        }

        function circleRectCollision(cx, cy, radius, rx, ry, rw, rh) {
          const dx = Math.abs(cx - rx);
          const dy = Math.abs(cy - ry);

          if (dx > rw / 2 + radius) return false;
          if (dy > rh / 2 + radius) return false;
          if (dx <= rw / 2) return true;
          if (dy <= rh / 2) return true;

          const cornerDist =
            Math.pow(dx - rw / 2, 2) + Math.pow(dy - rh / 2, 2);
          return cornerDist <= Math.pow(radius, 2);
        }

        function showMessage(text, isPersistent = false) {
          messageElement.innerText = text;
          messageElement.style.display = "block";
          if (!isPersistent) setTimeout(hideMessage, 1000);
        }

        function hideMessage() {
          messageElement.style.display = "none";
        }

        function getBallSide() {
          return ball.x < app.screen.width / 2 ? "player1" : "player2";
        }

        function showGameOver(winner) {
          const p1s = state.scores.player1.points;
          const p2s = state.scores.player2.points;

          const gameOverTitle = document.querySelector(".game-over-title");
          const finalScore = document.querySelector(".final-score");
          const rematchOptions = document.querySelector(".rematch-options");

          gameOverTitle.textContent =
            winner === "player1" ? "PLAYER WINS!" : "AI WINS!";
          gameOverTitle.style.color =
            winner === "player1" ? PLAYER_COLOR_HEX : AI_COLOR_HEX;
          finalScore.innerHTML = `Final Score: <span style="color: ${PLAYER_COLOR_HEX};">${p1s}</span> - <span style="color: ${AI_COLOR_HEX};">${p2s}</span>`;

          rematchOptions.innerHTML = "";

          const difficulties = ["beginner", "medium", "expert"];
          const currentIndex = difficulties.indexOf(AI_DIFFICULTY);

          if (winner === "player1") {
            const sameBtn = document.createElement("button");
            sameBtn.className = "rematch-btn";
            sameBtn.textContent = `REMATCH (${AI_DIFFICULTY.toUpperCase()})`;
            sameBtn.onclick = () => startRematch(AI_DIFFICULTY);
            rematchOptions.appendChild(sameBtn);

            if (currentIndex < difficulties.length - 1) {
              const harderBtn = document.createElement("button");
              harderBtn.className = "rematch-btn";
              const nextDiff = difficulties[currentIndex + 1];
              harderBtn.textContent = `HARDER (${nextDiff.toUpperCase()})`;
              harderBtn.onclick = () => startRematch(nextDiff);
              rematchOptions.appendChild(harderBtn);
            }
          } else {
            const sameBtn = document.createElement("button");
            sameBtn.className = "rematch-btn";
            sameBtn.textContent = `REMATCH (${AI_DIFFICULTY.toUpperCase()})`;
            sameBtn.onclick = () => startRematch(AI_DIFFICULTY);
            rematchOptions.appendChild(sameBtn);

            if (currentIndex > 0) {
              const easierBtn = document.createElement("button");
              easierBtn.className = "rematch-btn";
              const prevDiff = difficulties[currentIndex - 1];
              easierBtn.textContent = `EASIER (${prevDiff.toUpperCase()})`;
              easierBtn.onclick = () => startRematch(prevDiff);
              rematchOptions.appendChild(easierBtn);
            }
          }

          gameOverScreen.style.display = "flex";
        }

        function startRematch(difficulty) {
          AI_DIFFICULTY = difficulty;
          gameOverScreen.style.display = "none";
          initializeGameState();
          updateScoreUI();
          resetRound();
        }

        app = new PIXI.Application();
        await app.init({
          background: 0x000000,
          resizeTo: window,
          antialias: true,
        });
        document.body.appendChild(app.canvas);

        initializeGameState();
        setupScene();
        addControls();

        app.renderer.on("resize", resizeAndPosition);
        resizeAndPosition();

        updateScoreUI();

        const difficultyBtns = document.querySelectorAll(
          ".difficulty-btn[data-difficulty]",
        );
        difficultyBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            difficultyBtns.forEach((b) => b.classList.remove("selected"));
            btn.classList.add("selected");
            AI_DIFFICULTY = btn.dataset.difficulty;
          });
        });

        document
          .getElementById("start-game-btn")
          .addEventListener("click", () => {
            introScreen.style.display = "none";
            gameStarted = true;
            resetRound();
          });

        app.ticker.add(gameLoop);
        //app.ticker.maxFPS = 60
      });
    </script>
  </body>
</html>
